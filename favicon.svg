<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="Masortim">
  <title>Masortim</title>
  <!--
    Знак в духе Баухауса: три чистые фигуры — прямоугольник, треугольник,
    прямоугольник — складываются в букву M. Ничего лишнего: ни обводок, ни
    теней, ни градиентов. Только плакатные цвета и целые числа на сетке 192.

    Почему карточка, а не прозрачный фон: чёрные ноги буквы исчезают на
    тёмной панели вкладок. Бумажная подложка держит контраст на любом фоне,
    а скругление даёт мягкий край, не превращая знак в «кнопку».

    Красный клин — единственный акцент. Он же читается как стрелка вниз:
    знак работает и просто как геометрическая фигура, без расшифровки буквы.
  -->
  <rect x="4" y="4" width="184" height="184" rx="26" fill="#fffff8"/>
  <polygon points="46,28 146,28 96,164" fill="#d62828"/>
  <rect x="26" y="28" width="24" height="136" fill="#111111"/>
  <rect x="142" y="28" width="24" height="136" fill="#111111"/>
</svg>
