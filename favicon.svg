<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="Masortim">
  <!--
    Фавикон: аватар с GitHub, фон вырезан.

    Битые пиксели портрета нельзя «нарисовать» путями — это растр. Поэтому
    картинка вложена как data URI: браузер получает один файл и не делает
    лишний запрос. Прозрачность сохранена, поэтому иконка одинаково читается
    на светлой и тёмной вкладке.
  -->
  <image width="192" height="192" href="data:image/png;base64,"/>
</svg>
