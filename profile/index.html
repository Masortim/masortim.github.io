<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Masortim · profile hero</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      padding: 20px;
      display: grid;
      place-items: start center;
      background: #0d1117;
      color: #e6edf3;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      cursor: default;
      width: min(100%, 816px);
      aspect-ratio: 816 / 220;
      min-height: 190px;
      border: 1px solid #30363d;
      border-radius: 12px;
      background: #0d1117;
    }
    .hero__image {
      position: absolute;
      z-index: -2;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      cursor: default;
    }
    .hero::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(7, 12, 20, .14), transparent 62%);
    }
    .hero__copy {
      position: absolute;
      top: 27px;
      left: 28px;
      max-width: 440px;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: #77e3d7;
      font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 9px;
      color: #f0f6fc;
      font-size: 27px;
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: -.5px;
    }
    .description {
      max-width: 420px;
      margin: 0 0 12px;
      color: #e6edf3;
      font-size: 13px;
      line-height: 1.5;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #b4f4eb;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: color .16s ease, text-decoration-color .16s ease;
    }
    .cta__arrow { display: inline-block; transition: transform .16s ease; }
    .cta:hover, .cta:focus-visible {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .cta:hover .cta__arrow, .cta:focus-visible .cta__arrow { transform: translateX(3px); }
    @media (max-width: 600px) {
      body { padding: 12px; }
      .hero { min-height: 220px; aspect-ratio: auto; }
      .hero__image { object-position: 58% center; }
      .hero__copy { top: 21px; left: 18px; right: 16px; }
      h1 { font-size: 25px; }
      .description { max-width: 360px; }
    }
  </style>
</head>
<body>
  <main class="hero" aria-label="Masortim profile introduction">
    <img class="hero__image" src="masortim-profile-bg.png" alt="" aria-hidden="true">
    <div class="hero__copy">
      <p class="eyebrow">Developer · Research-minded builder</p>
      <h1>Ideas made useful</h1>
      <p class="description">Web tools, graph experiments and machine-learning projects—with a focus on clear, practical outcomes</p>
      <a class="cta" href="https://github.com/Masortim?tab=repositories">
        Explore selected repositories <span class="cta__arrow" aria-hidden="true">→</span>
      </a>
    </div>
  </main>
</body>
</html>
