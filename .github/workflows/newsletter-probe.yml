name: Newsletter API probe

# Проверка живого API рассылки с внешней стороны.
#
# Зачем отдельный workflow: из среды, где готовился код, домены Vercel
# недоступны, поэтому «деплой READY» ничего не говорит о том, отвечает ли
# функция и не закрыта ли она защитой деплоя Vercel. Раннер GitHub Actions
# имеет обычный доступ в интернет и видит ровно то же, что браузер читателя.
#
# Запускается вручную и на каждый push, затрагивающий серверную часть.

on:
  # Секрет GITHUB_TOKEN интеграции не позволяет dispatch, поэтому ручной
  # прогон делается push-ом с изменением в путях ниже.
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'api/newsletter/**'
      - 'newsletter/lib/**'
      - 'newsletter/edge/**'
      - '.github/workflows/newsletter-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Root endpoint
        run: |
          echo '--- GET / ---'
          code=$(curl -sS -o /tmp/root.json -w '%{http_code}' --max-time 20 https://masortim-newsletter.vercel.app/ || echo "000")
          server=$(curl -sS -o /dev/null -w '%{http_code}|%{redirect_url}' --max-time 20 https://masortim-newsletter.vercel.app/ || echo "000|")
          echo "status: $code"
          echo "detail: $server"
          head -c 300 /tmp/root.json 2>/dev/null; echo
          if [ "$code" != "200" ]; then
            echo "::error::PROBE root=$code detail=$server body=$(head -c 200 /tmp/root.json 2>/dev/null | tr -d '\n')"
            exit 1
          fi

      - name: Subscribe rejects a broken address
        run: |
          echo '--- POST /api/newsletter/subscribe (bad email) ---'
          code=$(curl -sS -o /tmp/sub.json -w '%{http_code}' --max-time 20 \
            -X POST -H 'Content-Type: application/json' \
            -d '{"email":"not-an-email","lang":"ru"}' \
            https://masortim-newsletter.vercel.app/api/newsletter/subscribe)
          echo "status: $code"
          cat /tmp/sub.json; echo
          if [ "$code" != "400" ]; then
            echo "::error::SUB bad-email code=$code body=$(head -c 300 /tmp/sub.json | tr -d '\n')"
            exit 1
          fi

      - name: Subscribe validates the address before sending
        run: |
          echo '--- POST /api/newsletter/subscribe (valid format) ---'
          # С реальной отправкой через Gmail нельзя совать выдуманный адрес:
          # список подписчиков засорится, а Gmail получит bounce и снизит
          # репутацию отправителя. Доставку проверяет шаг Full flow — там
          # письмо уходит на ящик самого отправителя.
          code=$(curl -sS -o /tmp/sub2.json -w '%{http_code}' --max-time 25 \
            -X POST -H 'Content-Type: application/json' \
            -d '{"email":"not-an-email","lang":"ru"}' \
            https://masortim-newsletter.vercel.app/api/newsletter/subscribe)
          echo "status: $code"; cat /tmp/sub2.json; echo
          if [ "$code" != "400" ]; then
            echo "::error::SUB valid-format code=$code body=$(head -c 300 /tmp/sub2.json | tr -d '\n')"
            exit 1
          fi
          echo "::notice::SUB валидация работает: адрес без домена отклонён до отправки"

      - name: Digest is protected
        run: |
          echo '--- GET /api/newsletter/digest (no secret) ---'
          code=$(curl -sS -o /tmp/dig.json -w '%{http_code}' --max-time 20 \
            https://masortim-newsletter.vercel.app/api/newsletter/digest)
          echo "status: $code"
          cat /tmp/dig.json; echo
          if [ "$code" != "401" ]; then
            echo "::error::ожидался 401 unauthorized, получен $code"
            exit 1
          fi

      - name: Token endpoint is closed
        run: |
          # Служебный маршрут выдаёт токен подтверждения по адресу, поэтому
          # без секрета обязан отвечать 401 — иначе любой мог бы подтверждать
          # и отписывать чужие адреса.
          echo '--- GET /api/newsletter/token (no secret) ---'
          code=$(curl -sS -o /tmp/tok.json -w '%{http_code}' --max-time 20 \
            "https://masortim-newsletter.vercel.app/api/newsletter/token?email=probe%40example.com")
          echo "status: $code"
          cat /tmp/tok.json 2>/dev/null; echo
          if [ "$code" != "401" ]; then
            echo "::error::TOKEN без секрета ожидался 401, получен $code — маршрут открыт"
            exit 1
          fi
          echo "::notice::TOKEN закрыт: без секрета 401"

      - name: CORS preflight for the site origin
        run: |
          echo '--- OPTIONS /api/newsletter/subscribe ---'
          curl -sS -D /tmp/headers.txt -o /dev/null --max-time 20 \
            -X OPTIONS -H 'Origin: https://masortim.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            https://masortim-newsletter.vercel.app/api/newsletter/subscribe
          grep -i '^access-control-allow-origin' /tmp/headers.txt || {
            echo "::error::нет заголовка Access-Control-Allow-Origin — браузер заблокирует форму"
            exit 1
          }

      - name: Deployment protection check
        run: |
          echo '--- защита деплоя Vercel ---'
          # Если включён Vercel Authentication, ответ будет редиректом на SSO
          # или 401 без JSON. Раннер увидит это так же, как браузер читателя.
          location=$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 20 \
            https://masortim-newsletter.vercel.app/api/newsletter/digest)
          echo "redirect: ${location:-нет}"
          case "$location" in
            *vercel.com/sso*|*vercel.com/login*)
              echo "::error::API закрыт Vercel Authentication — форма не сможет отправить запрос"
              exit 1
              ;;
          esac
          echo "внешняя защита не обнаружена"

      - name: Self-diagnosis says what is missing
        run: |
          echo '--- GET /api/newsletter/health ---'
          # Эндпоинт сам проверяет окружение: выбран ли транспорт, задан ли
          # пароль приложения, есть ли адрес отправителя. Секретов не
          # раскрывает — только да/нет.
          # Транспорт бывает двух видов: SMTP (Gmail, адрес автора) и Resend
          # (нужен проверенный домен). health знает оба и не путает их:
          # адрес на gmail.com сам по себе означает SMTP.
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 25 \
            https://masortim-newsletter.vercel.app/api/newsletter/health || echo "000")
          echo "status: $code"
          cat /tmp/health.json 2>/dev/null; echo
          if [ "$code" != "200" ]; then
            echo "::error::HEALTH code=$code body=$(head -c 300 /tmp/health.json 2>/dev/null | tr -d '\n')"
            exit 1
          fi
          ready=$(node -p 'String(require("/tmp/health.json").ready)' 2>/dev/null || echo unknown)
          blocking=$(node -p 'require("/tmp/health.json").blocking.join("; ")' 2>/dev/null || echo '')
          transport=$(node -p 'String(require("/tmp/health.json").checks.transport)' 2>/dev/null || echo unknown)
          sender=$(node -p 'String(require("/tmp/health.json").checks.fromAddress)' 2>/dev/null || echo unknown)
          if [ "$ready" = "true" ]; then
            echo "::notice::HEALTH ready=true — транспорт $transport"
          else
            echo "::warning::HEALTH ready=false — осталось: ${blocking:-см. блок checks в логе}"
          fi
          # Отправлять от чужого имени нельзя: получатель увидит подмену,
          # а Gmail такие письма отклоняет. Проверяем адрес явно.
          case "$sender" in
            *@gmail.com*) ;;
            *) [ "$transport" = "smtp" ] && {
                 echo "::error::NEWSLETTER_FROM=$sender не может уходить через Gmail: нужен адрес @gmail.com"
                 exit 1
               } ;;
          esac

      - name: Full flow when the API is ready
        id: flow
        env:
          # Адрес, на который приходит письмо. При SMTP Gmail это ящик
          # отправителя: письмо, отправленное самому себе, доходит всегда.
          OWNER_EMAIL: ${{ secrets.NEWSLETTER_OWNER_EMAIL || 'alex.typeface@gmail.com' }}
          # Токен подтверждения проба берёт у самого API
          # (/api/newsletter/token), а не из базы: ключ service_role в
          # секреты репозитория записать нельзя, да и незачем — функции уже
          # знают его из окружения Vercel. Эндпоинт закрыт CRON_SECRET.
          NEWSLETTER_CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          ready=$(node -p 'String(require("/tmp/health.json").ready)' 2>/dev/null || echo unknown)
          transport=$(node -p 'String(require("/tmp/health.json").checks.transport)' 2>/dev/null || echo unknown)
          if [ "$ready" != "true" ]; then
            echo "::notice::FLOW пропущен: API не готов (ready=$ready) — см. шаг самодиагностики"
            exit 0
          fi

          # health печатается без адреса отправителя: иначе GitHub вымарает
          # значением секрета весь лог, и причина ошибки станет не видна.
          node -e '
            const r = require("/tmp/health.json");
            console.log("health: ready=" + r.ready + " transport=" + r.checks.transport
              + " pass=" + r.checks.smtp.passSet + " user=" + r.checks.smtp.user.replace(/^(.).*(@.*)$/, "$1***$2"));
          '

          if [ -z "$OWNER_EMAIL" ]; then
            echo "::notice::FLOW подписка и весь цикл пропущены: задайте секрет NEWSLETTER_OWNER_EMAIL (ящик, на который приходит письмо)"
            exit 0
          fi

          # Адрес печатаем по частям: GitHub вымарывает любую строку, где
          # встречается значение секрета, и без этого в логе остаются пустые
          # строки вместо причины ошибки.
          local_part="${OWNER_EMAIL%@*}"
          echo "--- подписка ${local_part:0:3}***@${OWNER_EMAIL#*@} ---"
          code=$(curl -sS -o /tmp/sub_full.json -w '%{http_code}' --max-time 25 \
            -X POST -H 'Content-Type: application/json' -H 'Origin: https://masortim.github.io' \
            -d "{\"email\":\"$OWNER_EMAIL\",\"lang\":\"ru\"}" \
            https://masortim-newsletter.vercel.app/api/newsletter/subscribe)
          echo "status: $code"; cat /tmp/sub_full.json 2>/dev/null; echo
          if [ "$code" != "200" ]; then
            # Тело ответа печатаем внутри аннотации: в логе оно может быть
            # вымарано значением секрета, а аннотация видна всегда и сразу
            # называет код транспорта (например 535 auth_failed).
            detail=$(tr -d '\n' < /tmp/sub_full.json 2>/dev/null | head -c 300)
            echo "::error::FLOW подписка вернула $code, хотя health говорит ready=true; ответ: $detail"
            exit 1
          fi
          echo "::notice::FLOW подписка принята, письмо отправлено через SMTP Gmail"

          if [ -z "${NEWSLETTER_CRON_SECRET:-}" ]; then
            echo "::notice::FLOW подтверждение и отписка пропущены: в репозитории нет секрета CRON_SECRET (тот же, что в переменных Vercel)"
            exit 0
          fi

          token=$(curl -sS --max-time 25 \
            -H "Authorization: Bearer $NEWSLETTER_CRON_SECRET" \
            "https://masortim-newsletter.vercel.app/api/newsletter/token?email=$OWNER_EMAIL" \
            | node -e 'let s="";process.stdin.on("data",function(d){s+=d}).on("end",function(){try{process.stdout.write(String(JSON.parse(s).token||""))}catch(e){}})')
          if [ -z "$token" ]; then
            echo "::error::FLOW токен не найден через /api/newsletter/token — подписка не записалась или эндпоинт закрыт"
            exit 1
          fi

          loc=$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 25 \
            "https://masortim-newsletter.vercel.app/api/newsletter/confirm?token=$token")
          echo "confirm -> $loc"
          case "$loc" in
            *state=confirmed*|*state=already*) echo "::notice::FLOW подтверждение принято" ;;
            *) echo "::error::FLOW подтверждение не сработало: $loc"; exit 1 ;;
          esac

          loc=$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 25 \
            "https://masortim-newsletter.vercel.app/api/newsletter/unsubscribe?token=$token")
          echo "unsubscribe -> $loc"
          case "$loc" in
            *state=unsubscribed*) echo "::notice::FLOW отписка принята" ;;
            *) echo "::error::FLOW отписка не сработала: $loc"; exit 1 ;;
          esac

          # Строка должна исчезнуть: отписавшийся адрес в базе не хранится.
          left=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 \
            -H "Authorization: Bearer $NEWSLETTER_CRON_SECRET" \
            "https://masortim-newsletter.vercel.app/api/newsletter/token?email=$OWNER_EMAIL")
          # 404 — строки нет, это успех; 200 — адрес всё ещё в списке.
          case "$left" in
            404) left=0 ;;
            200) left=1 ;;
            *) [ -n "$left" ] || left=unknown ;;
          esac
          if [ "$left" != "0" ]; then
            echo "::error::FLOW после отписки в базе осталось строк: $left"
            exit 1
          fi
          echo "::notice::FLOW цикл замкнут: подписка -> письмо -> подтверждение -> отписка -> строка удалена"
          echo "::notice::FLOW транспорт: $transport"

      - name: Weekly digest actually sends
        # Проверяем настоящую отправку, но только на свой ящик: ?test_to
        # не двигает дату выпуска и не рассылает живым подписчикам.
        env:
          OWNER_EMAIL: ${{ secrets.NEWSLETTER_OWNER_EMAIL || 'alex.typeface@gmail.com' }}
          NEWSLETTER_CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${NEWSLETTER_CRON_SECRET:-}" ]; then
            echo "::notice::DIGEST пропущен: в репозитории нет секрета CRON_SECRET"
            exit 0
          fi

          api=https://masortim-newsletter.vercel.app/api/newsletter/digest
          call() { curl -sS --max-time 90 -H "Authorization: Bearer $NEWSLETTER_CRON_SECRET" "$1"; }

          # 1. Что вообще есть: какие записи, сколько живых подписчиков.
          dry=$(call "$api?dry_run=1")
          echo "dry_run: $dry"
          case "$dry" in
            *'"error"'*) echo "::error::DIGEST dry_run вернул ошибку: $dry"; exit 1 ;;
          esac
          notes=$(printf '%s' "$dry" | node -e 'let s="";process.stdin.on("data",function(d){s+=d}).on("end",function(){try{const p=JSON.parse(s);process.stdout.write(String((p.notes||[]).length))}catch(e){process.stdout.write("0")}})')
          if [ "$notes" = "0" ]; then
            echo "::error::DIGEST не видит ни одной записи — сломан сбор заметок из feed.xml"
            exit 1
          fi

          # 2. Настоящая отправка ровно на этот ящик.
          test=$(call "$api?test_to=$OWNER_EMAIL")
          echo "test_to: $test"
          sent=$(printf '%s' "$test" | node -e 'let s="";process.stdin.on("data",function(d){s+=d}).on("end",function(){try{process.stdout.write(String(JSON.parse(s).sent))}catch(e){process.stdout.write("-1")}})')
          if [ "$sent" != "1" ]; then
            echo "::error::DIGEST пробное письмо не ушло (sent=$sent): $test"
            exit 1
          fi
          echo "::notice::DIGEST пробное письмо отправлено на скрытый ящик, живые подписчики не тронуты"

          # 3. Повторный запуск не должен слать второй раз: дата выпуска
          #    за эту неделю уже стоит, либо выпуск честно ждёт воскресенья.
          again=$(call "$api")
          echo "повторный запуск: $again"
          case "$again" in
            *'"reason":"duplicate_week"'*)
              echo "::notice::DIGEST защита от дубля работает: за эту неделю выпуск уже был" ;;
            *'"sent":0'*)
              echo "::notice::DIGEST второй раз не отправляет: новых заметок нет или выпуск уже ушёл" ;;
            *'"error"'*)
              echo "::error::DIGEST повторный запуск вернул ошибку: $again"; exit 1 ;;
            *)
              echo "::error::DIGEST повторный запуск отправил письма ещё раз: $again"; exit 1 ;;
          esac

      - name: Digest schedule covers Sunday and Monday
        run: |
          # Штатный выпуск — воскресенье 09:00 UTC, страховка — понедельник.
          # На бесплатном плане Vercel запуск best-effort и с точностью «в
          # течение часа», поэтому одно из двух заданий может не состояться.
          echo '--- crons в vercel.json ---'
          cat vercel.json | tr -d '\n' | sed 's/  */ /g'; echo
          node -e '
            const cfg = require("./vercel.json");
            const crons = (cfg.crons || []).filter((c) => c.path === "/api/newsletter/digest");
            const days = crons.map((c) => c.schedule.split(" ").pop());
            console.log("заданий digest:", crons.length, "-> дни:", days.join(", "));
            const ok = days.includes("0") && days.includes("1");
            if (!ok) { console.error("::error::CRON нужны задания на воскресенье (0) и понедельник (1)"); process.exit(1); }
            console.log("::notice::CRON расписание: воскресенье + понедельник (09:00 UTC)");
          '

      - name: Does the site point at this API
        run: |
          echo '--- newsletter/config.js на сайте ---'
          # Файл может быть ещё не опубликован GitHub Pages: серверная часть
          # от этого не зависит, поэтому здесь предупреждение, а не отказ.
          code=$(curl -sS -o /tmp/cfg.js -w '%{http_code}' --max-time 20 \
            https://masortim.github.io/newsletter/config.js)
          echo "status: $code"
          grep -i 'NEWSLETTER_API_BASE' /tmp/cfg.js && exit 0
          echo "::warning::config.js недоступен или без адреса API (status=$code) — форма может не найти бэкенд"

