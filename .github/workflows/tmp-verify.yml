name: TEMP verify build
on:
  push:
    branches: [arena/c41dbd8d-masortim-github-io]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: graph/package-lock.json
      - name: Install Dependencies
        working-directory: ./graph
        run: npm ci
      - name: Build Production Web Application
        working-directory: ./graph
        run: npm run build
      - name: Assemble Site Artifact
        run: |
          rm -rf _site
          mkdir -p _site/graph _site/profile
          cp -R graph/dist/. _site/graph/
          cp -R profile/. _site/
          cp -R profile/. _site/profile/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
