name: Deploy Linear Algebra NSU Graph to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Права доступа для публикации в GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Предотвращение параллельных конфликтующих деплоев
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: graph/package-lock.json

      # Приложение (Vite) находится в каталоге graph/, а не в корне репозитория
      - name: Install Dependencies
        working-directory: ./graph
        run: npm ci

      - name: Build Production Web Application
        working-directory: ./graph
        run: npm run build

      # Собираем артефакт сайта:
      #   /            -> profile/index.html (корневая страница пользователя)
      #   /profile/    -> та же страница (сохранение старых ссылок)
      #   /graph/...   -> собранное приложение (vite base = '/graph/')
      - name: Assemble Site Artifact
        run: |
          rm -rf _site
          mkdir -p _site/graph _site/profile
          cp -R graph/dist/. _site/graph/
          cp -R profile/. _site/
          cp -R profile/. _site/profile/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
