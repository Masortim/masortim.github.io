name: Deploy Developer Diary and Linear Algebra Graph to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Права доступа для публикации в GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Предотвращение параллельных конфликтующих деплоев
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: graph/package-lock.json

      # Приложение (Vite) находится в каталоге graph/, а не в корне репозитория
      - name: Install Dependencies
        working-directory: ./graph
        run: npm ci

      - name: Build Production Web Application
        working-directory: ./graph
        run: npm run build

      # RSS-фиды собираются из HTML самих заметок, поэтому они всегда актуальны
      # на момент деплоя: новая папка diary/<slug>/ попадает в оба фида
      # автоматически (feed.xml — русский, feed-en.xml — английский).
      - name: Build RSS Feeds
        run: node scripts/build-feed.mjs --site https://masortim.github.io

      # Дневник занимает корень сайта и /diary/; приложение графа остаётся в /graph/.
      # /tufte/ публикуется целиком: CSS, JS, шрифты ET Book, примеры и образец.
      - name: Assemble Site Artifact
        run: |
          rm -rf _site
          mkdir -p _site/graph _site/diary _site/tufte
          cp -R graph/dist/. _site/graph/
          cp index.html _site/index.html
          cp feed.xml _site/feed.xml
          cp feed-en.xml _site/feed-en.xml
          cp feed-icon.svg _site/feed-icon.svg
          cp -R diary/. _site/diary/
          cp tufte/tufte-universal.css _site/tufte/
          cp tufte/tufte-universal.js _site/tufte/
          cp tufte/*.html _site/tufte/
          cp -R tufte/img _site/tufte/
          cp -R tufte/et-book _site/tufte/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: './_site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
